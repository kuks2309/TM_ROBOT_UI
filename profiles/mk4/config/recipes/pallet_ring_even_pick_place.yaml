# Recipe: 팔레트 순환 이송 총집본 — 짝수 (0 → 2 → 4 → 0) (MK4)
# TM Task Manager Recipe File (MK4)
#
# [무엇] 박스 1개를 pallet0 에서 집어 pallet2 에 놓고 … 마지막에 pallet0 로 돌려놓는다.
#        3 사이클 = 집기 3 + 놓기 3.
#
# [!! 홀·짝을 나눈 이유 !!]
#   MK4 는 팔레트가 로봇 양쪽에 나뉘어 있다 —
#     짝수 0·2·4 : 로봇 앞쪽 (중심 X≈+393 · Z≈-297)
#     홀수 1·3·5 : 로봇 뒤쪽 (중심 X≈-418 · Z≈+11)
#   한 파일에서 0→1→2… 로 돌리면 사이클마다 약 810mm 를 앞뒤로 횡단한다.
#   본 레시피는 **짝수 그룹(로봇 앞쪽 (중심 X≈+393 · Z≈-297)) 안에서만** 돌므로 그 횡단이 없다.
#
# [팔레트 축] 평면 X축 = 짧은 변 → offset_rz 89.607
#
# [출처] pallet{N}_pick.yaml / pallet{N}_place.yaml 의 잡을 **텍스트 그대로** 이어붙였다.
#        offset·속도·가드는 개별 레시피와 완전히 동일하다. 캡션 앞 사이클 표식과
#        id 재번호만 이 파일에서 추가된 것이다.
#
# [자세 값] 2026-08-20 실기 티칭 역산 공구오차 적용 — 상세는 개별 레시피 헤더 참조.
# [모션 규칙] move_to_saved_pose 미사용. 팔레트를 떠날 때마다 move_linear 로 공구 -Z 150mm 후퇴.
#
# [!! 안전 !!]
#   · 시작 전 pallet0 에 박스가 있어야 하고, pallet2·pallet4 는 비어 있어야 한다.
#   · 첫 접근은 Run 누른 시점의 자세에서 목표 자세로 맞춘 뒤 이동한다 —
#     반드시 팔레트 밖 안전한 높이에서 시작할 것.
#   · **첫 실행은 반드시 Step 으로.**

name: 팔레트 순환 이송 총집본 — 짝수 (0 → 2 → 4 → 0) (MK4)
description: 박스 1개를 pallet0→2→4→0 로 순환 이송한다. 짝수 팔레트는 로봇 앞쪽 (중심 X≈+393 · Z≈-297)에 모여 있어 앞뒤 횡단이 없다. 개별 pallet{N}_pick / _place 를 이어붙인 총집본.
version: '1.0'
created: '2026-08-20'
modified: '2026-08-20'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: 박스 1개를 pallet0→2→4→0 로 순환 이송한다 (MK4 짝수)
    author: jjh
    version: '1.0'
    vision_origin_check: none
# ───── 사이클 1/3 : pallet0 집기 → pallet2 놓기 ─────
# 인터록 — 집기 전 소스 재고 확인. 비었으면 이 사이클(15잡)을 통째로 건너뛴다.
#   on_mismatch: stop=레시피 정지 · skip=이 사이클 건너뜀 · ignore=무시하고 진행
- id: 2
  type: check_magazine
  name: 매거진 재고 확인
  caption: P0→P2 · 인터록 — pallet0 에 박스가 있어야 집는다
  params:
    slot: 0
    expect: present
    timeout: 3.0
    on_mismatch: skip
    skip_count: 14
- id: 3
  type: smc_release
  name: SMC 그리퍼 놓기
  caption: P0→P2 · 집기 전 그리퍼 열기
  params:
    timeout: 30.0
- id: 4
  type: load_plate_pose
  name: Plate Pose 불러오기
  caption: P0→P2 · pallet0 저장 데이터 불러오기
  params:
    source_path: data/plate_pose_calc/pallet0
    file_prefix: pallet0_cali
    average_count: 10
    rect_guard_enabled: true
    max_side_diff_mm: 1.0
    max_diagonal_diff_mm: 1.5
    max_angle_error_deg: 1.0
- id: 5
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: P0→P2 · 파지 높이 +20mm 위로 접근 (L자, 여기서 1회 정지) — 파지면 +20mm 위 (L자, 하강 정지 1회)
  params:
    offset_x: -3.138
    offset_y: -0.756
    offset_z: 180.279
    offset_rx: -177.970
    offset_ry: 0.149
    offset_rz: -90.701
    velocity: 20.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
- id: 6
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: P0→P2 · pallet0 에서 집기 (실기 티칭 기반) — 법선 직선 20mm @3%
  params:
    offset_x: -3.138
    offset_y: -0.756
    offset_z: 160.279
    offset_rx: -177.970
    offset_ry: 0.149
    offset_rz: -90.701
    velocity: 3.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
    straight_path: true
