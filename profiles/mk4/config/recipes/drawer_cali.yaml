# Recipe: drawer_cali — 드로어 팔레트 4점 측정 (MK4)
#
# [역할] 드로어 마커를 재고, 그 마커 좌표계로 칼리브레이션 마크 4점을 순회 측정해
#   plate_pose 를 남긴다. 측정 전용 — 물건을 집지 않는다.
#
# [이 레시피는 마커를 «스스로» 찍는다 — drawer_marker_scan 을 쓰지 않는다]
#   job 3 의 손목 자세가 Rz 0.01 로, drawer_marker_scan 계열의 Rz -89.99 와 90도 다르다.
#   MK4 는 카메라 벡터가 자세 의존적이라(실측 z 편차 4.8mm, sigma 2.10mm) 두 자세로 잰
#   마커값이 어긋난다. job 6~13 의 4점 offset 은 «Rz 0.01 로 잰 마커» 기준으로 뽑은
#   값이므로, 다른 자세의 저장본을 끌어다 쓰면 4점이 전부 그만큼 밀린다.
#
# [저장 폴더를 나눈 이유] 같은 이유로, 이 레시피의 마커는 data/landmark_pose/drawer_cali 에
#   따로 남긴다. drawer_pick / drawer_place 가 읽는 data/landmark_pose/drawer 와 섞이면
#   파지 위치가 몇 mm 밀린다.

name: drawer_cali
description: 드로어 마커를 1샷 측정하고, 그 마커 좌표계(Rz 기준) 오프셋으로 칼리브레이션 마크 4개를 순회 측정해 plate_pose
  를 저장한다. 마커 좌표는 Job 5 가 따로 남긴다.
version: '1.0'
created: '2026-08-15'
modified: '2026-08-22'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: pallet0 드로어 마커 기준 4점 측정 마스터
    author: jjh
    version: '1.0'
    vision_origin_check: none
