# Recipe: 드로어 마커 스캔 — 중간 (MK4)
#
# [역할] 드로어 마커를 10회 스캔·3sigma 평균내어 «파일로» 남긴다. 로봇은 물건을
#   건드리지 않는다. 집기/놓기는 drawer_pick · drawer_place 가 이 파일을 읽어서 한다.
#
# [왜 나눴나] 드로어에서 집어 → 팔레트에 놓고 → 다시 드로어에 놓는 흐름에서, 중간에
#   다른 레시피가 끼면 메모리의 latest_scan 은 보장되지 않는다(GUI 재시작·타 마커 스캔).
#   파일로 남기면 레시피 경계를 넘어 살아남는다.
#
# [단이 바뀌면 이 파일만 바꾼다] 파지 상대좌표는 마커 기준이라 3단이 모두 같다.
#   단마다 다른 것은 «마커를 보러 가는 자세» 하나뿐 — 그게 이 레시피다.
#     상단  X 199.73  Y 567.02  Z  248.08
#     중간  X 154.75  Y 567.01  Z    8.07   ← 추정
#     하단  X 109.77  Y 567.01  Z -231.95
#   간격 ΔZ 240.01mm · ΔX 44.98mm 로 균등하다. X 가 단마다 45mm 변하는 이유는 **미확인**.
#
# [이 단] 중간 — **추정값** — 실측 티칭 필요
#
# [촬영 전 그리퍼를 닫는 이유] 열린 손가락이 카메라 시야를 가려 마커 검출을 방해한다.
#
# [저장 위치] data/landmark_pose/drawer/  — drawer_cali 와 폴더를 나눈다.
#   cali 는 손목 Rz 0.01 로 찍고 이쪽은 -89.99 다. MK4 는 카메라 벡터가 자세 의존적이라
#   (실측 z 편차 4.8mm) 두 자세의 마커값이 어긋난다. 섞이면 파지가 그만큼 밀린다.

name: 드로어 마커 스캔 — 중간 (MK4)
description: 드로어(중간) 마커를 10회 스캔해 3sigma 평균을 파일로 남긴다. drawer_pick · drawer_place 가 이 파일을 읽는다.
