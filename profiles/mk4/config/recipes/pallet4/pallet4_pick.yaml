# Recipe: pallet4 집기/놓기 (MK4)
# TM Task Manager Recipe File (MK4)
#
# [팔레트 축] 평면 X축 = 짧은 변(137mm) → offset_rz 89.607
#
# [자세 값 — 2026-08-20 실기 티칭 역산]
#   사용자가 pallet5 에 무충돌로 들어가는 자세를 실기에서 직접 잡았고(절대 TCP
#   X -419.09 Y -222.99 Z 172.42 Rx -179.30 Ry -0.11 Rz 179.68), 그것을 평면 좌표계로
#   역산해 **공구 좌표계 오차**를 뽑았다. 좌표계와 무관한 «공구가 어떻게 잘못 달렸는가» 다:
#
#     dx -0.792 · dy +0.884 · dz -2.045 mm  |  drx +0.534 · dry +1.418 · drz +0.393 deg
#
#   ry 가 +1.418° 로 가장 크다 — 그리퍼가 그만큼 기울어 달려 있다.
#
#   **팔레트마다 숫자가 다른 이유**: MK4 는 P0/P2/P4 와 P1/P3/P5 의 평면 좌표축이 90° 다르다.
#   같은 공구 오차라도 평면 좌표계에서는 다른 값으로 나타나므로, pallet5 값을 그대로
#   복사하면 dx/dy 가 90° 틀어진다. 각 팔레트의 기준자세에 오차를 되씌워 산출했다.
#   프리셋: config/plane_align_offsets.yaml (5축 — z 는 프리셋 스키마에 없어 offset_z 에 반영)
#
# [모션 규칙] move_to_saved_pose 를 쓰지 않고, 팔레트를 떠날 때 move_linear 로 공구 -Z 후퇴한다.
# [그리퍼] MK4 는 SMC — smc_grip/smc_release 는 액션이라 완료를 기다린다(wait 스텝 불필요).
#
# [!! 안전 !!] 첫 이동은 Run 누른 시점의 자세에서 목표 자세로 맞춘 뒤 이동한다.
#   반드시 팔레트·드로어 밖 안전한 높이에서 시작할 것. 첫 실행은 Step 으로.

name: pallet4 집기 (MK4)
description: pallet4 저장 평면을 불러와 평면 좌표계로 박스를 집고 공구 -Z 로 후퇴한다. 오프셋은 2026-08-20 실기 티칭 역산 공구오차 적용.
version: '1.0'
created: '2026-08-19'
modified: '2026-08-20'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: pallet4 에서 박스를 집는다
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
  type: smc_release
  name: SMC 그리퍼 놓기
  caption: 집기 전 그리퍼 열기
  params:
    timeout: 30.0
- id: 3
  type: load_plate_pose
  name: Plate Pose 불러오기
  caption: pallet4 저장 데이터 불러오기
  params:
    source_path: data/plate_pose_calc/pallet4
    file_prefix: pallet4_cali
    average_count: 10
    rect_guard_enabled: true
    max_side_diff_mm: 1.0
    max_diagonal_diff_mm: 1.5
    max_angle_error_deg: 1.0
- id: 4
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 파지 높이 +20mm 위로 접근 (L자, 여기서 1회 정지) — 파지면 +20mm 위 (L자, 하강 정지 1회)
  params:
    offset_x: -3.138
    offset_y: -0.756
    offset_z: 180.279
    offset_rx: -177.970
    offset_ry: 0.149
    offset_rz: -90.701
    velocity: 20.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
- id: 5
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: pallet4 에서 집기 (실기 티칭 기반) — 법선 직선 20mm @3%
  params:
    offset_x: -3.138
    offset_y: -0.756
    offset_z: 160.279
    offset_rx: -177.970
    offset_ry: 0.149
    offset_rz: -90.701
    velocity: 3.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
    straight_path: true
- id: 6
  type: smc_grip
  name: SMC 그리퍼 파지
  caption: 박스 파지
  params:
    timeout: 30.0
    bypass_interlock: false
    verify_skip: false
- id: 7
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: pallet4 에서 들어올림 — 법선 직선 20mm @3% (상승 정지 1회)
  params:
    offset_x: -3.138
    offset_y: -0.756
    offset_z: 180.279
    offset_rx: -177.970
    offset_ry: 0.149
    offset_rz: -90.701
    velocity: 3.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
    straight_path: true
- id: 8
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: pallet4 에서 들어올림 — 법선 직선 230mm @20%
  params:
    offset_x: -3.138
    offset_y: -0.756
    offset_z: 410.279
    offset_rx: -177.970
    offset_ry: 0.149
    offset_rz: -90.701
    velocity: 20.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
