    offset_x: -1.602
    offset_y: -0.864
    offset_z: 181.337
    offset_rx: -179.466
    offset_ry: -1.418
    offset_rz: -0.393
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 11
  type: move_to_plane_pose
  name: 평면 좌표계 이동
