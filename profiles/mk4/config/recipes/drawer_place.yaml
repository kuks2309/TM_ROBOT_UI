    max_radius_mm: 600.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 5
  type: smc_release
  name: SMC 그리퍼 놓기
  caption: 박스 놓기
  params:
    timeout: 30.0
- id: 6
  type: move_linear
  name: 직선 이동
  caption: 그리퍼 빼기 — 공구 -Z 150mm (자세 유지 직선)
