# Recipe: 드로어에 놓기 (MK4) — 단 무관
#
# [역할] drawer_pick 의 역순. 박스를 든 채 시작해 드로어의 같은 자리에 내려놓는다.
#
# [선행 필수] drawer_marker_scan_high|mid|low 중 하나를 **먼저** 돌려야 한다.
#   저장본이 30분을 넘으면 [거부]하고 멈춘다(max_age_min).
#
# [이 레시피의 존재 이유] 드로어에서 집고 → 팔레트 레시피를 돌리고 → 다시 드로어에
#   놓는 흐름에서, 중간 레시피가 메모리의 마커를 덮어써도 이쪽은 파일을 읽어 살아남는다.
#
# [들어옴 = 나감] 접근·하강·후퇴 모두 drawer_pick 과 같은 값·같은 축을 쓴다.
#   후퇴만 공구 -Z 직선이다(pick 의 들어올림과 동일한 이유 — 가드 스침 방지).
#
# [!! 안전 !!] 시작 시 그리퍼가 박스를 «쥐고 있어야» 한다. 빈 손으로 돌리면
#   job 6 이 허공에서 열릴 뿐이나, 박스를 든 줄 알고 다음 공정이 이어지면 위험하다.
#   첫 실행은 반드시 Step 으로.

name: 드로어에 놓기 (MK4)
description: drawer_marker_scan 이 남긴 마커 저장본을 읽어, 그 좌표계 상대좌표로 박스를 드로어에 내려놓는다. 단(상/중/하) 구분 없음.
version: '3.0'
created: '2026-08-23'
modified: '2026-08-23'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: 저장된 드로어 마커 기준으로 박스를 내려놓는다
    author: jjh
    version: '3.0'
    vision_origin_check: none
- id: 2
  type: move_to_point
  name: 포인트 이동
  caption: 안전위치 (박스 파지 상태)
  params:
    motion_type: tcp
    X: -16.35
    Y: 660.56
    Z: 359.34
    Rx: 179.44
    Ry: 0.05
    Rz: -90.77
    velocity: 25.0
    decomposed_tcp: true
  robot_base:
    X: -16.35
    Y: 660.56
    Z: 359.34
    Rx: 179.44
    Ry: 0.05
    Rz: -90.77
- id: 3
  type: move_to_landmark_pose
  name: 마커 좌표계 이동
  caption: 놓을 높이 +20mm 위로 접근 (L자, 여기서 1회 정지)
  params:
    frame_mode: rz_only
    landmark_source: file
    source_path: data/landmark_pose/drawer
    file_prefix: drawer_marker_scan
    average_count: 1
    max_age_min: 30.0
    offset_x: -2.797
    offset_y: -240.266
    offset_z: -110.39699999999999
    offset_rx: 179.44
    offset_ry: 0.08
    offset_rz: 89.469
    tool_offset_x: 0.0
    tool_offset_y: 0.0
    tool_offset_z: 0.0
    tool_offset_rx: 0.0
    tool_offset_ry: 0.0
    tool_offset_rz: 0.0
    velocity: 20.0
    max_radius_mm: 600.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
- id: 4
  type: move_to_landmark_pose
  name: 마커 좌표계 이동
  caption: 드로어에 내려놓기 — 법선 직선 20mm @3%
  params:
    frame_mode: rz_only
    landmark_source: file
    source_path: data/landmark_pose/drawer
    file_prefix: drawer_marker_scan
    average_count: 1
    max_age_min: 30.0
    offset_x: -2.797
    offset_y: -240.266
    offset_z: -130.397
    offset_rx: 179.44
    offset_ry: 0.08
    offset_rz: 89.469
