# 고정 마커 반복 측정 레시피 (오차 누적·프레임 휨 계측 원시 데이터 수집)
# ⚠️ move_to_point 의 X/Y/Z/Rx/Ry/Rz 는 플레이스홀더 — 실제 마커 관측 자세로 교체하거나 GUI 에서 티칭할 것.
# 후퇴자세(AWAY)는 관측자세 Z+120mm — 충돌 없는지 확인 후 사용.
name: marker_error_calibration
description: 고정 마커를 같은 TCP 자세로 N회 이동·측정해 오차 누적/프레임 휨 계측용 원시 데이터를 모은다. ⚠️ move_to_point
  좌표는 실제 마커 관측 자세로 교체(또는 GUI 티칭) 필요. 분석은 저장 YAML을 오프라인 스크립트로.
version: '1.0'
created: '2026-08-17'
modified: '2026-08-17'
