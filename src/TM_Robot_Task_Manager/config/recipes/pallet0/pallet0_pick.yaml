# Recipe: pallet0 집기
# TM Task Manager Recipe File

name: pallet0 집기
description: pallet0 저장 평면(pallet0_cali)을 불러와 평면 좌표계로 박스를 집고, 공구 -Z 로 후퇴한다. 자세는 8/15
  성공값 그대로(법선에서 0.332° 기운 그리퍼 장착 오차 보정 포함).
version: '1.0'
created: '2026-08-18'
modified: '2026-08-24'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: pallet0 에서 박스를 집는다
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
  type: schunk_release
  name: SCHUNK 그리퍼 놓기
  caption: 집기 전 그리퍼 열기
  params:
    timeout: 15.0
- id: 3
  type: wait
  name: 대기
  caption: 그리퍼 동작 완료 대기
  params:
    duration: 2000
- id: 4
  type: load_plate_pose
  name: Plate Pose 불러오기
  caption: pallet0 저장 데이터 불러오기
  params:
    source_path: data/plate_pose_calc/pallet0
    file_prefix: pallet0_cali
    average_count: 10
    rect_guard_enabled: true
    max_side_diff_mm: 1.0
    max_diagonal_diff_mm: 1.5
    max_angle_error_deg: 1.0
- id: 5
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트 위 접근 (집는 높이 +100mm) — 파지면 +20mm 위 (L자, 하강 정지 1회)
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 177.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 20.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
- id: 6
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 집기 (pallet0~5 성공값) — 법선 직선 20mm @3%
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 157.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 7
  type: schunk_grip
  name: SCHUNK 그리퍼 파지
  params:
    timeout: 15.0
- id: 8
  type: wait
  name: 대기
  caption: 그리퍼 동작 완료 대기
  params:
    duration: 2000
- id: 9
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 들어올림 (집는 높이 +100mm) — 법선 직선 20mm @3% (상승 정지 1회)
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 177.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 10
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 들어올림 (집는 높이 +100mm) — 법선 직선 230mm @20%
