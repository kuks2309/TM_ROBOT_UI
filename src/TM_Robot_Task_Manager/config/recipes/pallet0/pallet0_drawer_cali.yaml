# Recipe: pallet0 드로어 마커 기준 4점 측정 (마스터)
# TM Task Manager Recipe File
#
# [구조] 드로어 마커 1샷 → 마커 좌표계로 4점 순회 → plate_pose 저장
#   Job 6/8/10/12 는 move_to_landmark_pose (마커 좌표계 이동) 이다.
#   offset_* 는 마커를 원점으로 한 좌표이고, frame_mode: rz_only 이므로
#   회전은 마커 Rz 만 쓴다 — 마커 rx/ry 측정 산포를 받지 않는다.
#   coordinate_mode 는 쓰지 않는다(YAML 전용이라 UI 에 안 보이고,
#   '현재위치 입력' 이 절대좌표를 덮어써 깨지는 사고가 있었다).
#
# [offset 값의 출처 — 전부 실측]
#   2026-08-15 드로어 11회 측정(data/landmark_pose + data/plate_pose_calc)에서
#   마커 좌표계(rz_only) 기준으로 역산한 평균이다. 강체 가정·회전 추정 없음.
#   티칭 TCP1 산포: ±0.015 / ±0.003 / ±0.010 mm
#   (마커 자세 전체를 쓴 프레임은 ±0.118 / ±0.162 / ±0.140 mm 로 10배 나쁘다)
#
#   접근점 간 거리 = 마크 배치 실측과 일치:
#     1→2  137.188 mm      2→3  196.058 mm
#     3→4  137.454 mm      4→1  196.277 mm
#   (대각선 240.100 / 238.804, 차 1.30mm — rect_guard 상한 1.5mm 에 여유 0.2mm)
#
# [마커 ↔ 팔레트 상대 오프셋 — 11회 평균]
#   plate_pose 중심:  X   0.647 ±0.118   Y 239.680 ±0.162   Z 298.179 ±0.140 mm
#                     Rx -179.352 ±0.036  Ry 0.370 ±0.026   Rz  -0.221 ±0.005 deg
#   ※ 드로어를 옮기지 않은 상태의 반복이므로 '불변'은 아직 미검증이다.
#     위치·자세를 바꿔 몇 회 더 찍어야 확정된다.
#
# [!! 안전 !!]
#   조그는 정지/일시정지를 확인한 뒤에만 한다. 레시피 실행 중 조그는 CommandGate
#   대상이 아니라(ADR 2026-08-15 수동 명령 게이트) 실행 중간에 끼어들 수 있다.

name: pallet0 드로어 마커 기준 4점 측정 (마스터)
description: 드로어 마커를 1샷 측정하고, 그 마커 좌표계(Rz 기준) 오프셋으로 칼리브레이션 마크 4개를 순회 측정해 plate_pose 를 저장한다.
  마커 좌표는 Job 5 가 따로 남긴다.
version: '1.0'
created: '2026-08-15'
modified: '2026-08-15'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: pallet0 드로어 마커 기준 4점 측정 마스터
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
