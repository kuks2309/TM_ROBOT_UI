# Recipe: 드로어에서 집기 (MK2)
#
# [선행 필수] drawer_marker_scan 을 «먼저» 돌려야 한다. 이 레시피는 스스로 마커를
#   찍지 않고 data/landmark_pose/drawer/ 의 저장본을 읽는다. 저장본이 30분을 넘으면
#   [거부]하고 멈춘다(max_age_min) — 드로어는 여닫히면 마커가 움직이므로 낡은 값을
#   조용히 쓰면 엉뚱한 곳에 손이 간다.
#
# [알려진 한계] 그리퍼가 박스 양옆만 파지해 **앞뒤(평면 Y) 오차를 잡지 못한다.**
#   최초 박스가 앞뒤로 치우쳐 있으면 그 편심이 그대로 유지된다.
#
# [값 출처] 기존 drawer/drawer_pick.yaml · drawer/pallet_to_drawer_pick_place.yaml 의
#   MK2 티칭값 그대로다. 집기와 놓기의 오프셋이 실제로 동일하다(둘 다 -142.222 / 접근 7.778).
#   MK4 에서 넘어온 숫자는 **하나도 없다** — 구조만 MK4 의 분할 방식을 따랐다.
#
# [그리퍼 뒤 wait 2000ms 를 왜 두는가] SCHUNK 서비스는 `received=True`(수신 확인)만
#   돌려주고 개폐 완료를 보증하지 않는다. 이 대기를 빼면 그리퍼가 아직 움직이는 중에
#   로봇이 이동한다. MK4 는 액션이 결과까지 블로킹해서 이 대기가 없다 — 따라 하지 말 것.
#
# [!! 안전 !!] 첫 이동은 Run 누른 시점의 자세에서 목표 자세로 맞춘 뒤 이동한다.
#   반드시 팔레트·드로어 밖 안전한 높이에서 시작할 것. 첫 실행은 Step 으로.

name: 드로어에서 집기 (MK2)
description: drawer_marker_scan 이 남긴 마커 저장본을 읽어, 그 좌표계 상대좌표로 드로어의 박스를 집고 공구 -Z 로 후퇴한다.
version: '1.0'
created: '2026-08-23'
modified: '2026-08-23'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: 저장된 드로어 마커 기준으로 박스를 집는다
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
  type: schunk_release
  name: SCHUNK 그리퍼 놓기
  caption: 집기 전 그리퍼 열기
  params:
    timeout: 15.0
- id: 3
  type: wait
  name: 대기
  caption: 그리퍼 동작 완료 대기
  params:
    duration: 2000
- id: 4
  type: move_to_landmark_pose
  name: 마커 좌표계 이동
  caption: 박스 위 접근 (집는 높이 +150mm)
  params:
    frame_mode: rz_only
    landmark_source: file
    source_path: data/landmark_pose/drawer
    file_prefix: drawer_marker_scan
    average_count: 1
    max_age_min: 30.0
    offset_x: -10.585
    offset_y: -245.144
    offset_z: 7.778
    offset_rx: 179.96
    offset_ry: -0.06
    offset_rz: 89.938
    tool_offset_x: 0.0
    tool_offset_y: 0.0
    tool_offset_z: 0.0
    tool_offset_rx: 0.0
    tool_offset_ry: 0.0
    tool_offset_rz: 0.0
    velocity: 20.0
    max_radius_mm: 600.0
    decel_zone_mm: 40.0
    decel_velocity: 10.0
- id: 5
  type: move_to_landmark_pose
  name: 마커 좌표계 이동
  caption: 드로어에서 집기 (8/15 성공값)
  params:
    frame_mode: rz_only
    landmark_source: file
    source_path: data/landmark_pose/drawer
    file_prefix: drawer_marker_scan
    average_count: 1
    max_age_min: 30.0
    offset_x: -10.585
    offset_y: -245.144
    offset_z: -142.222
    offset_rx: 179.96
    offset_ry: -0.06
    offset_rz: 89.938
    tool_offset_x: 0.0
    tool_offset_y: 0.0
    tool_offset_z: 0.0
    tool_offset_rx: 0.0
    tool_offset_ry: 0.0
    tool_offset_rz: 0.0
    velocity: 8.0
    max_radius_mm: 600.0
    decel_zone_mm: 40.0
    decel_velocity: 5.0
- id: 6
  type: schunk_grip
  name: SCHUNK 그리퍼 파지
  caption: 박스 파지
  params:
    timeout: 15.0
- id: 7
  type: wait
  name: 대기
  caption: 그리퍼 동작 완료 대기
  params:
    duration: 2000
- id: 8
  type: move_to_landmark_pose
  name: 마커 좌표계 이동
  caption: 박스 들어올림 (집는 높이 +150mm)
  params:
    frame_mode: rz_only
    landmark_source: file
    source_path: data/landmark_pose/drawer
    file_prefix: drawer_marker_scan
    average_count: 1
    max_age_min: 30.0
    offset_x: -10.585
    offset_y: -245.144
    offset_z: 7.778
    offset_rx: 179.96
    offset_ry: -0.06
    offset_rz: 89.938
    tool_offset_x: 0.0
    tool_offset_y: 0.0
    tool_offset_z: 0.0
    tool_offset_rx: 0.0
