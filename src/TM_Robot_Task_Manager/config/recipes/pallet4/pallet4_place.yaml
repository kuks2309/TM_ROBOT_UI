# Recipe: pallet4 놓기 (평면 좌표계 방식)
# TM Task Manager Recipe File
#
# [모션 규칙] pallet_all_align_from_file.yaml (8/15 세션 75주기 59.9분 무중단 완주)에서 가져왔다.
#   · move_to_saved_pose 를 쓰지 않는다 — 팔레트 안 제자리 회전이 충돌 원인이었다
#   · 팔레트에서 빠질 때는 move_linear 로 공구 -Z 후퇴
#
# [전제] 박스를 이미 쥔 상태에서 시작한다 (pallet4_pick 뒤에 잇는다). 시작 시 그리퍼를 건드리지 않는다.
#
# [자세 값 — 2026-08-19 실기 확정] 순환 총집본(pallet_ring_pick_place.yaml)에서
#   가드 충돌 없이 통과한 조합이다. 평면 좌표계 기준:
#     offset_x -0.81 / offset_y 0.02        평면 중심 (100회 완주본과 동일)
#     offset_z 157.292                       집기·놓기 높이
#     offset_z 257.292                       그보다 100mm 위 (접근·이탈)
#     offset_rx 180.0 / offset_ry 0.0        평면 법선에 정확히 수직
#     offset_rz 90.0                         평면 X축(짧은 변) 기준 +90°
#
# [!! offset_rz 를 -90.008 로 되돌리지 말 것 !!]
#   -90.008 은 +90.0 의 정반대 방향이다. 그 값으로 순환 시험을 돌리자
#   **박스를 든 채 내려갈 때 6개 팔레트 전부 가드와 충돌**했다(2026-08-19).
#   박스가 TCP 기준으로 편심돼 매달리므로 180° 반전 시 편심이 반대편으로 넘어가
#   박스 모서리가 가드에 닿는다. XY 를 중심으로 옮기는 것으로는 해결되지 않았다.
#
# [알려진 한계 — 앞뒤(평면 Y) 오차]
#   그리퍼가 박스의 양옆만 파지해 **앞뒤 오차를 잡지 못한다.** 마커 무게중심은
#   앞뒤 두 벽 중점의 정확한 중점이라(수학적 항등식, 실측 비대칭 0.0000mm)
#   중심 계산 자체는 무결하지만, 최초 박스가 앞뒤로 치우쳐 있으면 그 편심이
#   순환 내내 그대로 유지된다. 팔레트별 앞뒤 여유도 다르다(중심→벽):
#     pallet5 98.047 < pallet2 98.284 < pallet3 98.288 < pallet1 98.296 < pallet4 98.364 < pallet0 98.398
#   여유가 작은 팔레트부터 짧은 벽에 닿는다. 근본 해결은 팔레트별 앞뒤 티칭.
#
# [!! 안전 !!]
#   Job 3(접근)은 Run 누른 시점의 자세에서 목표 자세로 맞춘 뒤 이동한다. 박스를 든 채이므로
#   반드시 팔레트 밖 안전한 높이에서 시작할 것. 첫 실행은 Step 으로.

name: pallet4 놓기
description: 쥐고 있는 박스를 pallet4 저장 평면(pallet4_cali) 위에 평면 좌표계로 놓고, 공구 -Z 로 후퇴한다. 자세는 8/15 성공값 그대로(법선에서 0.332° 기운 그리퍼 장착 오차 보정 포함).
version: '1.0'
created: '2026-08-18'
modified: '2026-08-19'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: 쥐고 있는 박스를 pallet4 에 놓는다
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
  type: load_plate_pose
  name: Plate Pose 불러오기
  caption: pallet4 저장 데이터 불러오기
  params:
    source_path: data/plate_pose_calc/pallet4
    file_prefix: pallet4_cali
    average_count: 10
    rect_guard_enabled: true
    max_side_diff_mm: 1.0
    max_diagonal_diff_mm: 1.5
    max_angle_error_deg: 1.0
- id: 3
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트 위 접근 (놓는 높이 +100mm) — 파지면 +20mm 위 (L자, 하강 정지 1회)
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 177.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 20.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
- id: 4
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에 놓기 (pallet0~5 성공값) — 법선 직선 20mm @3%
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 157.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 5
  type: schunk_release
  name: SCHUNK 그리퍼 놓기
  params:
    timeout: 15.0
- id: 6
  type: wait
  name: 대기
  caption: 그리퍼 동작 완료 대기
  params:
    duration: 2000
- id: 7
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 빠짐 (놓는 높이 +100mm) — 법선 직선 20mm @3% (상승 정지 1회)
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 177.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 8
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 빠짐 (놓는 높이 +100mm) — 법선 직선 230mm @20%
  params:
    offset_x: -0.81
    offset_y: 0.02
    offset_z: 407.292
    offset_rx: 180.0
    offset_ry: 0.0
    offset_rz: 90.0
    velocity: 20.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
