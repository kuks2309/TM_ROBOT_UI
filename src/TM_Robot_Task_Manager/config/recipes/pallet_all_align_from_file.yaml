# Recipe: pallet0 저장데이터 정렬 (스캔 없음)
# TM Task Manager Recipe File

name: 팔레트 0~5 저장데이터 정렬 (스캔 없음)
description: pallet0~5 의 저장된 plate_pose 를 불러와(마커 스캔 없이) 헤드를 평면 법선에 수직 정렬. 마커 탈거 등으로
  재측정이 불가하고 플레이트가 움직이지 않았을 때만 사용.
version: '1.0'
created: '2026-08-14'
modified: '2026-08-15'
jobs:
- id: 1
  type: load_plate_pose
  name: Plate Pose 불러오기
  caption: pallet0 저장 데이터 불러오기
  params:
    source_path: data/plate_pose_calc/pallet0
    file_prefix: pallet0_cali
    average_count: 10
    rect_guard_enabled: true
    max_side_diff_mm: 1.0
    max_diagonal_diff_mm: 1.5
    max_angle_error_deg: 1.0
- id: 2
