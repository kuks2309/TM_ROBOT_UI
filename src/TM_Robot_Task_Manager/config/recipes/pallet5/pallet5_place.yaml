name: pallet5 놓기
description: pallet5 저장 평면(pallet5_teach)을 불러와 평면 좌표계로 박스를 놓는다. 자세는 티칭 생값 그대로.
version: '1.0'
created: '2026-08-24'
modified: '2026-08-24'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: pallet5 에서 박스를 놓는다
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
  type: load_plate_pose
  name: Plate Pose 불러오기
  caption: pallet5 저장 데이터 불러오기
  params:
    source_path: data/plate_pose_calc/pallet5
    file_prefix: pallet5_teach
    average_count: 1
    rect_guard_enabled: true
    max_side_diff_mm: 1.0
    max_diagonal_diff_mm: 1.5
    max_angle_error_deg: 1.0
- id: 3
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트 위 접근 (놓기 높이 +250mm) — 파지면 +20mm 위 (L자, 하강 정지 1회)
  params:
    offset_x: 0.525
    offset_y: -1.113
    offset_z: 178.106
    offset_rx: -179.267
    offset_ry: -0.245
    offset_rz: 89.753
    velocity: 20.0
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 10.0
- id: 4
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에 놓기 (티칭값) — 법선 직선 20mm @3%
  params:
    offset_x: 0.525
    offset_y: -1.113
    offset_z: 158.106
    offset_rx: -179.267
    offset_ry: -0.245
    offset_rz: 89.753
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 5
  type: schunk_release
  name: SCHUNK 그리퍼 놓기
  params:
    timeout: 15.0
- id: 6
  type: wait
  name: 대기
  caption: 그리퍼 동작 완료 대기
  params:
    duration: 2000
- id: 7
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 빠짐 (놓기 높이 +250mm) — 법선 직선 20mm @3% (상승 정지 1회)
  params:
    offset_x: 0.525
    offset_y: -1.113
    offset_z: 178.106
    offset_rx: -179.267
    offset_ry: -0.245
    offset_rz: 89.753
    velocity: 3.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
- id: 8
  type: move_to_plane_pose
  name: 평면 좌표계 이동
  caption: 팔레트에서 빠짐 (놓기 높이 +250mm) — 법선 직선 230mm @20%
  params:
    offset_x: 0.525
    offset_y: -1.113
    offset_z: 408.106
    offset_rx: -179.267
    offset_ry: -0.245
    offset_rz: 89.753
    velocity: 20.0
    straight_path: true
    max_tilt_deg: 30.0
    max_radius_mm: 200.0
    decel_zone_mm: 0.0
    decel_velocity: 3.0
