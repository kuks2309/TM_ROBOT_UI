name: table-1 놓기 [TCP linear 시험본]
description: table-1 위치 마커 좌표계로 박스를 놓는다 (비고정식). table-1_marker_scan 을 먼저 실행해야 한다 /
  접촉·이탈을 공구 -Z 직선(Move_Line TPP)으로 바꾼 시험본. 원본과 나란히 두고 비교한다.
