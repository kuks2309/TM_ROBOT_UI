# Recipe: 팔레트 순환 이송 — align_to_plane_normal 방식 (0→1→2→3→4→5→0)
# TM Task Manager Recipe File
#
# [목적] 현행 ring(move_to_plane_pose 방식)과 동일 조건에서 접근 방식만 바꿔 비교한다.
#
# [근거] 박스를 들고 돈 실측 비교 (2026-08-24 사용자 확인):
#     align 방식 + 단일 오프셋      → 대부분 양호, p5 만 접촉
#     move_to_plane_pose + 단일 오프셋 → p0·p1 만 깨끗
#   같은 단일 오프셋 조건에서 align 이 더 많은 팔레트를 커버했다.
#
# [기각된 설명] "align 은 오프셋이 공구 좌표계라 유리하다" — 검증 결과 기각.
#   두 티칭값(p0·p5)을 공구계로 환산해도 차이가 1.752mm 로 평면계 차이(1.750mm)와 같다.
#   MK2 는 plate rz 가 89.58~90.01° 로 거의 같아 좌표계를 바꿔도 값이 안 모인다.
#
# [남은 가설] rz 강제 여부.
#   move_to_plane_pose 는 공구 rz 를 (plate_rz + offset_rz) 로 매 팔레트 강제한다.
#   그런데 plate rz 는 팔레트마다 0.42° 흩어져 있다(같은 프레임 위이므로 계측오차).
#   align 은 rz_mode 로 그 강제를 피한다. 100회본은 pallet0·1 만 'plane',
#   나머지는 'keep' 이었다 — 처음 한 번만 평면에서 rz 를 잡고 그 뒤로는 유지하는 패턴.
#   본 레시피는 그 패턴을 그대로 따른다(첫 정렬만 plane, 이후 전부 keep).
#
# [원본에서 가져온 것]
#   align/move_linear 파라미터 = pallet_all_align_from_file.yaml (100회본) 그대로
#   공구 오프셋 (0.02, -0.81) = 100회본과 동일. p0 티칭값을 공구계로 환산한 값과 일치.
#   높이 157.292(파지) / 177.292(접근) = 현행 ring 과 동일
#   인터록 slot 배정 = 현행 ring 과 동일
#
# [현행 ring 과 다른 점]
#   · move_to_plane_pose → align_to_plane_normal (평면계 XY 지정 → 공구계 오프셋)
#   · 이탈이 move_linear 공구 -Z 150mm (100회본 방식). 407.292 상승 잡 없음.
#   · 인터록 on_mismatch 를 전부 stop 으로 했다 — 시험용이므로 이상 시 건너뛰지 말고 정지.
#
# [!! 안전 !!]
#   · 시작 전 pallet0 에 박스, pallet1~5 는 비어 있어야 한다.
#   · 첫 align 이 Run 누른 시점의 TCP 위치에서 제자리 회전한다 —
#     반드시 팔레트 밖 안전한 높이에서 시작할 것.
#   · **첫 실행은 반드시 Step 으로.**

name: 팔레트 순환 이송 — align 방식 (0→1→2→3→4→5→0)
description: align_to_plane_normal 기반 순환 이송. 현행 ring(move_to_plane_pose)과 비교용. 공구 오프셋 단일값(0.02,-0.81), 첫 정렬만 rz_mode=plane 이후 keep.
