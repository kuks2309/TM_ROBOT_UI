# Recipe: 드로어 → 팔레트 (박스 이송)
# TM Task Manager Recipe File

name: 드로어 → 팔레트 (박스 이송)
description: 드로어 마커를 1샷 측정해 마커 좌표계로 드로어의 박스를 집고, 팔레트 평면 좌표계로 놓는다. 드로어·팔레트가 어디에 있든
  같은 상대 위치로 간다.
version: '1.0'
created: '2026-08-15'
modified: '2026-08-15'
jobs:
- id: 1
  type: recipe_info
  name: Recipe 개요
  params:
    mode: execution
    description: 드로어에서 박스를 집어 팔레트에 놓는다
    author: jjh
    version: '1.0'
    vision_origin_check: none
- id: 2
