    max_radius_mm: 200.0
    max_tilt_deg: 30.0
    offset_rx: 179.673
    offset_ry: -0.058
    offset_rz: -90.008
    offset_x: 2.582
    offset_y: 1.524
    offset_z: 176.292
    velocity: 3.0
    straight_path: true
  type: move_to_plane_pose
- caption: 팔레트에서 들어올림 — 법선 직선 80mm @20%
  id: 14
