# MK2 로봇 프로필
#
# 근거:
#   robot_ip   — launch/task_manager.launch.py 의 MK2 기본값 (192.168.192.127)
#   gripper    — config/recipes 63개가 schunk_grip 70 / schunk_release 116 회 사용
#                (SMC 는 1건뿐이라 시험 흔적으로 본다)
#   identify   — REMOTE_HOSTS.md(2026-08-20 실측) · known_hosts
#
# ⚠️ MK2 의 SCHUNK 는 완료 검증 센서가 없다. job_executor `_exec_schunk_gripper` 는
#    서비스의 `received=True`(수신 확인)만 보고 성공으로 친다 — 실제로 물렸는지는
#    코드가 알 수 없다. MK4(SMC)는 BUSY/INP 센서로 완료를 판정한다. 같은 레시피라도
#    두 기계의 보증 수준이 다르다는 뜻이라, 화면·로그에서 이를 숨기지 않는다.
id: mk2
label: "MK2 (LG Paju C6 Rx)"

robot_ip: "192.168.192.127"

gripper:
  id: schunk
  label: "SCHUNK 서보 그리퍼"
  # 완료 검증 센서 없음 — 수신 확인(received)만 가능
  verifies_completion: false

identify:
  # 이 중 하나라도 로컬 IPv4 와 일치하면 이 프로필로 본다
  ips:
    - "192.168.44.4"
    - "192.168.44.22"
    - "192.168.192.12"
    - "172.16.1.102"

workspace:
  # 로봇 본체에서의 원본 경로 (참고용 — 단수 Project)
  origin: "/home/tc/Project/jjh/TM_Robot_MK2_ros2_ws"
