# MK4 버퍼 매거진 감지 설정.
#
# 값의 출처는 4호기(Tx) 실측본 magazine.lgit-c6-4.yaml 이다 — 같은 폴더에 원본을
# 그대로 두었으니 대조할 것. MK4 는 같은 remote_io_ros 스테이션(그리퍼 스택이 이미
# 기동한다 — run:106)의 같은 DI 이미지를 보므로 비트 폭·주기는 검증됐다:
#   · di_word_count 5 × 16 = 80 비트          (remote_io_node.cpp:69,183)
#   · 20ms 주기 → debounce_ticks 50 = 1s      (remote_io_node.cpp 헤더 주석)
#
# ⚠ 미검증: 트레이 감지 6점이 MK4 스테이션에도 **같은 비트 26~31 로 배선돼 있는지**는
#   실기 확인 전이다(배선 사실이라 코드로 알 수 없다). 확인 절차는 docs/ 의 이식 ADR 참조.
#   틀린 매핑이면 노드가 기동 실패로 죽는다(범위·중복 검증) — 다만 «범위 안의 다른 비트»는
#   검증을 통과하므로, 실기에서 자리마다 매거진을 넣어 present 가 그 자리만 켜지는지 볼 것.
magazine_detect_node:
  ros__parameters:
    # 슬롯 → DI 비트. 인덱스가 슬롯 번호이고 앞/뒤가 교차한다 —
    # 0 앞왼(26) · 1 뒤왼(29) · 2 앞중(27) · 3 뒤중(30) · 4 앞오(28) · 5 뒤오(31).
    # 도면 배선 일련번호(170PX17~22) 순서로 읽으면 6자리 중 4자리가 틀린다.
    # 레시피의 palletN 이 곧 슬롯 N 이다.
    di_bit: [26, 29, 27, 30, 28, 31]

    # 원시 0 = 매거진 있음(센서 NC). 4호기 실기 실측 2026-08-22 + 레거시 task_operator.cpp:297-311.
    detected_when_low: true

    # 값이 바뀐 상태로 연속 N 프레임이어야 확정. io_resp 20ms 기준 50 = 1s.
    debounce_ticks: 50

    # remote_io_ros 의 io_di 비트 수. 범위 검증에만 쓴다.
    di_bit_count: 80

    # 이 시간 넘게 io_resp 가 없으면 stale. io_resp 는 읽기 성공 시에만 나온다.
    stale_after_s: 1.0
