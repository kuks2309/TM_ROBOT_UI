# MK2(2호기 Rx) 버퍼 매거진 감지 설정.
#
# ⚠ MK4 판과 결정적으로 다른 값이 하나 있다 — di_bit_count 다.
#   2호기 스테이션은 DI 4워드(64점), 4호기·MK4 는 5워드(80점)다.
#   근거: lgit_moma_rx2.yaml 의 layout.di_word_count=4, 그리고 실측 io_resp 의 io_di 길이 64.
#   80 으로 두면 범위 검증이 없는 점(64~79)을 통과시켜 «판정 불가» 를 못 잡는다.
#
# [배선은 추정이 아니라 실측이다 — 2026-08-23]
#   자리마다 매거진을 넣은 상태와 뺀 상태를 각각 1초씩 샘플링해, 그 사이 «정확히 한 점만»
#   뒤집힌 경우에만 확정했다(tools 성격의 일회용 스크립트 di_map.py). 6자리 전부 1:1 로
#   갈렸고 극성도 6자리가 모두 같았다.
#
#     pallet0 → 26 (있음=0, 없음=1)      pallet3 → 30 (있음=0, 없음=1)
#     pallet1 → 29 (있음=0, 없음=1)      pallet4 → 28 (있음=0, 없음=1)
#     pallet2 → 27 (있음=0, 없음=1)      pallet5 → 31 (있음=0, 없음=1)
#
#   결과적으로 di_bit 배열은 4호기(magazine.lgit-c6-4.yaml)와 «같다». 다만 그건 확인된
#   사실이지 전제가 아니었다 — 4호기 값을 복사해 놓고 맞기를 바란 것이 아니라, 재고 나니
#   같았다. 스테이션을 바꾸거나 배선을 손대면 다시 재야 한다.
magazine_detect_node:
  ros__parameters:
    # 슬롯 → DI 점. 인덱스가 슬롯 번호이고 앞/뒤가 교차한다 —
    # 0 앞왼(26) · 1 뒤왼(29) · 2 앞중(27) · 3 뒤중(30) · 4 앞오(28) · 5 뒤오(31).
    # 레시피의 palletN 이 곧 슬롯 N 이다.
    di_bit: [26, 29, 27, 30, 28, 31]

    # 원시 0 = 매거진 있음(센서 NC). 6자리 실측 일치.
    detected_when_low: true

    # 값이 바뀐 상태로 연속 N 프레임이어야 확정. io_resp 20ms 기준 50 = 1s.
    debounce_ticks: 50

    # 2호기 스테이션의 DI 점 수. 범위 검증에만 쓴다. ← MK4(80) 와 다르다.
    di_bit_count: 64

    # 이 시간 넘게 io_resp 가 없으면 stale. io_resp 는 읽기 성공 시에만 나온다.
    stale_after_s: 1.0
