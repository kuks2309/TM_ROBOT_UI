base:
- base/yolov8_seg.yaml
network:
  network_name: yolov8s_seg_custom
parser:
  nodes:
  - images
  - - /model.22/cv2.0/cv2.0.2/Conv
    - /model.22/cv3.0/cv3.0.2/Conv
    - /model.22/cv2.1/cv2.1.2/Conv
    - /model.22/cv3.1/cv3.1.2/Conv
    - /model.22/cv2.2/cv2.2.2/Conv
    - /model.22/cv3.2/cv3.2.2/Conv
    - /model.22/cv4.0/cv4.0.2/Conv
    - /model.22/cv4.1/cv4.1.2/Conv
    - /model.22/cv4.2/cv4.2.2/Conv
  normalization_params:
    normalize_in_net: true
    mean_list:
    - 0
    - 0
    - 0
    std_list:
    - 255.0
    - 255.0
    - 255.0
postprocessing:
  meta_arch: yolov8_seg
  mask_threshold: 0.5
  nms_iou_thresh: 0.6
  score_threshold: 0.001
  classes: 1
info:
  task: instance segmentation
  input_shape: 640x480x3
  output_shape: 160x120x32, 20x15x37, 40x30x37, 80x60x37
  framework: pytorch
  training_data: custom jig_latch
